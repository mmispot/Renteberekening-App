<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Rentemeester</title>
<style>
  :root{
    --ink:#1B2430;
    --paper:#EFEAE0;
    --paper-line:#D9D2C2;
    --brass:#B8934A;
    --brass-dark:#8C6D33;
    --forest:#3F6650;
    --forest-soft:#E4EBE4;
    --danger:#A44435;
    --white:#FFFFFF;
    font-variant-numeric: tabular-nums;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: var(--ink);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", Arial, sans-serif;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background: var(--ink);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* Header */
  header{
    padding: max(22px, env(safe-area-inset-top)) 24px 18px;
    color: var(--paper);
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--brass);
    font-weight:600;
    margin:0 0 4px;
  }
  header h1{
    font-family: "Iowan Old Style", "Palatino", Georgia, serif;
    font-size:28px;
    font-weight:700;
    margin:0;
    letter-spacing:-.01em;
  }

  /* Views */
  .view{
    flex:1;
    background: var(--paper);
    border-radius: 22px 22px 0 0;
    padding: 22px 20px 24px;
    display:none;
    flex-direction:column;
    gap:18px;
  }
  .view.active{display:flex;}

  /* Segmented control */
  .segmented{
    display:flex;
    background: var(--paper-line);
    border-radius:12px;
    padding:3px;
  }
  .segmented button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 8px;
    font-size:14px;
    font-weight:600;
    color:#6b6357;
    border-radius:9px;
    font-family:inherit;
    cursor:pointer;
    transition: background .18s ease, color .18s ease;
  }
  .segmented button.active{
    background: var(--white);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }

  /* Ledger card / form */
  .ledger{
    background: var(--white);
    border-radius:16px;
    padding: 6px 18px 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .field:last-child{border-bottom:none;}
  .field label{
    font-size:14.5px;
    color:#5b5346;
    font-weight:500;
  }
  .field .input-wrap{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .field input[type=number]{
    width:110px;
    text-align:right;
    border:none;
    font-family: "Iowan Old Style", Georgia, serif;
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    background:transparent;
    outline:none;
    -moz-appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .field .unit{
    font-size:14px;
    color:#8a8272;
    font-weight:600;
  }
  select.field-select{
    border:none;
    background:transparent;
    font-family: -apple-system, sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    text-align:right;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    padding-right:2px;
  }

  /* Calculate button */
  .btn-primary{
    background: var(--ink);
    color: var(--paper);
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    letter-spacing:.01em;
  }
  .btn-primary:active{opacity:.85;}

  /* Result stamp */
  .result{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding: 10px 0 4px;
    animation: rise .28s ease;
  }
  .result.active{display:flex;}
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .stamp{
    width:150px;
    height:150px;
    border-radius:50%;
    border:3px solid var(--brass);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform: rotate(-4deg);
    color: var(--brass-dark);
    position:relative;
  }
  .stamp::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid var(--brass);
    border-radius:50%;
    opacity:.55;
  }
  .stamp .stamp-label{
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-weight:700;
  }
  .stamp .stamp-amount{
    font-family:"Iowan Old Style", Georgia, serif;
    font-size:23px;
    font-weight:700;
    margin-top:3px;
  }
  .result-row{
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:9px 4px;
    font-size:15px;
    border-bottom:1px solid var(--paper-line);
  }
  .result-row:last-of-type{border-bottom:none;}
  .result-row .k{color:#6b6357;}
  .result-row .v{font-weight:700; font-family:"Iowan Old Style", Georgia, serif; font-size:16.5px;}

  .btn-save{
    width:100%;
    background: transparent;
    border:1.5px solid var(--forest);
    color: var(--forest);
    border-radius:14px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .btn-save:active{background: var(--forest-soft);}
  .btn-save.saved{
    background: var(--forest-soft);
    color: var(--forest);
    border-color: var(--forest-soft);
    pointer-events:none;
  }

  /* History */
  .hist-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .hist-header h2{
    font-family:"Iowan Old Style", Georgia, serif;
    font-size:20px;
    margin:0;
  }
  .clear-all{
    border:none;
    background:none;
    color:var(--danger);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .hist-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow-y:auto;
    padding-bottom:8px;
  }
  .hist-item{
    background:var(--white);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .hist-item .hi-main{flex:1; min-width:0;}
  .hist-item .hi-type{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color: var(--brass-dark);
    font-weight:700;
    margin-bottom:2px;
  }
  .hist-item .hi-desc{
    font-size:13.5px;
    color:#6b6357;
    margin-bottom:2px;
  }
  .hist-item .hi-amount{
    font-family:"Iowan Old Style", Georgia, serif;
    font-size:18px;
    font-weight:700;
    color:var(--ink);
  }
  .hist-item .hi-date{
    font-size:11.5px;
    color:#a39c8d;
    margin-top:2px;
  }
  .hist-del{
    border:none;
    background:none;
    padding:6px;
    cursor:pointer;
    color:#b7ab97;
    flex-shrink:0;
  }
  .hist-del:active{color:var(--danger);}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:#8a8272;
  }
  .empty .empty-emoji{font-size:34px; display:block; margin-bottom:10px;}
  .empty p{font-size:14.5px; margin:0; line-height:1.5;}

  /* Tab bar */
  nav.tabbar{
    display:flex;
    background: rgba(239,234,224,.96);
    backdrop-filter: blur(10px);
    border-top:1px solid var(--paper-line);
    padding: 8px 10px max(8px, env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:4px 0;
    color:#a39c8d;
    font-family:inherit;
    cursor:pointer;
  }
  nav.tabbar button svg{width:24px; height:24px;}
  nav.tabbar button span{font-size:11px; font-weight:600;}
  nav.tabbar button.active{color: var(--forest);}

  .toast{
    position:absolute;
    bottom: 90px;
    left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding:10px 18px;
    border-radius:20px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform: translateX(-50%) translateY(-4px);}
</style>
</head>
<body>
<div id="app">

  <header>
    <p class="eyebrow">Rentemeester</p>
    <h1 id="header-title">Rekenen</h1>
  </header>

  <!-- REKENEN VIEW -->
  <section class="view active" id="view-rekenen">

    <div class="segmented" id="type-segmented">
      <button data-type="enkelvoudig" class="active">Enkelvoudig</button>
      <button data-type="samengesteld">Samengesteld</button>
    </div>

    <div class="ledger">
      <div class="field">
        <label for="hoofdsom">Hoofdsom</label>
        <div class="input-wrap">
          <span class="unit">€</span>
          <input type="number" id="hoofdsom" inputmode="decimal" placeholder="1000" min="0" step="0.01">
        </div>
      </div>
      <div class="field">
        <label for="percentage">Rentepercentage</label>
        <div class="input-wrap">
          <input type="number" id="percentage" inputmode="decimal" placeholder="4" min="0" step="0.01">
          <span class="unit">% /jr</span>
        </div>
      </div>
      <div class="field">
        <label for="looptijd">Looptijd</label>
        <div class="input-wrap">
          <input type="number" id="looptijd" inputmode="decimal" placeholder="90" min="0" step="1">
          <span class="unit">dagen</span>
        </div>
      </div>
      <div class="field" id="frequentie-field" style="display:none;">
        <label for="frequentie">Rente bijschrijven</label>
        <select class="field-select" id="frequentie">
          <option value="1">Jaarlijks</option>
          <option value="2">Halfjaarlijks</option>
          <option value="4">Per kwartaal</option>
          <option value="12">Maandelijks</option>
        </select>
      </div>
    </div>

    <button class="btn-primary" id="btn-bereken">Bereken rente</button>

    <div class="result" id="result">
      <div class="stamp">
        <span class="stamp-label">Totale rente</span>
        <span class="stamp-amount" id="stamp-amount">€ 0</span>
      </div>
      <div class="ledger" style="width:100%;">
        <div class="result-row"><span class="k">Hoofdsom</span><span class="v" id="res-hoofdsom">€ 0</span></div>
        <div class="result-row"><span class="k">Eindbedrag</span><span class="v" id="res-eindbedrag">€ 0</span></div>
      </div>
      <button class="btn-save" id="btn-save">Bewaar deze berekening</button>
    </div>

  </section>

  <!-- GESCHIEDENIS VIEW -->
  <section class="view" id="view-geschiedenis">
    <div class="hist-header">
      <h2>Oude berekeningen</h2>
      <button class="clear-all" id="btn-clear-all">Wis alles</button>
    </div>
    <div class="hist-list" id="hist-list">
      <div class="empty" id="hist-empty">
        <span class="empty-emoji">🗒️</span>
        <p>Nog geen berekeningen bewaard.<br>Reken iets uit en tik op "Bewaar".</p>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <nav class="tabbar">
    <button class="active" data-view="rekenen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2.5"/><line x1="8" y1="7.5" x2="16" y2="7.5"/><line x1="7.5" y1="12" x2="7.5" y2="12"/><line x1="12" y1="12" x2="12" y2="12"/><line x1="16.5" y1="12" x2="16.5" y2="12"/><line x1="7.5" y1="16" x2="7.5" y2="16"/><line x1="12" y1="16" x2="12" y2="16"/><line x1="16.5" y1="16" x2="16.5" y2="16"/></svg>
      <span>Rekenen</span>
    </button>
    <button data-view="geschiedenis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 5v4h4"/><path d="M12 8v4l3 2"/></svg>
      <span>Geschiedenis</span>
    </button>
  </nav>

</div>

<script>
  const STORAGE_PREFIX = 'berekening:';
  let currentType = 'enkelvoudig';
  let lastCalc = null;

  // ---------- Tab navigation ----------
  const tabButtons = document.querySelectorAll('nav.tabbar button');
  const views = { rekenen: document.getElementById('view-rekenen'), geschiedenis: document.getElementById('view-geschiedenis') };
  const headerTitle = document.getElementById('header-title');

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(views).forEach(v => v.classList.remove('active'));
      const target = btn.dataset.view;
      views[target].classList.add('active');
      headerTitle.textContent = target === 'rekenen' ? 'Rekenen' : 'Geschiedenis';
      if (target === 'geschiedenis') loadHistory();
    });
  });

  // ---------- Segmented control ----------
  const segButtons = document.querySelectorAll('#type-segmented button');
  const freqField = document.getElementById('frequentie-field');
  segButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      segButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentType = btn.dataset.type;
      freqField.style.display = currentType === 'samengesteld' ? 'flex' : 'none';
      document.getElementById('result').classList.remove('active');
    });
  });

  // ---------- Formatting ----------
  const fmtEUR = n => n.toLocaleString('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 });

  // ---------- Calculate ----------
  document.getElementById('btn-bereken').addEventListener('click', () => {
    const hoofdsom = parseFloat(document.getElementById('hoofdsom').value);
    const percentage = parseFloat(document.getElementById('percentage').value);
    const looptijd = parseFloat(document.getElementById('looptijd').value);

    if (!(hoofdsom > 0) || !(percentage >= 0) || !(looptijd >= 0)) {
      showToast('Vul hoofdsom, percentage en looptijd in');
      return;
    }

    const r = percentage / 100;
    const jaren = looptijd / 365;
    let eindbedrag, rente;

    if (currentType === 'enkelvoudig') {
      rente = hoofdsom * r * jaren;
      eindbedrag = hoofdsom + rente;
    } else {
      const n = parseInt(document.getElementById('frequentie').value, 10);
      eindbedrag = hoofdsom * Math.pow(1 + r / n, n * jaren);
      rente = eindbedrag - hoofdsom;
    }

    document.getElementById('stamp-amount').textContent = fmtEUR(rente);
    document.getElementById('res-hoofdsom').textContent = fmtEUR(hoofdsom);
    document.getElementById('res-eindbedrag').textContent = fmtEUR(eindbedrag);
    document.getElementById('result').classList.add('active');

    const saveBtn = document.getElementById('btn-save');
    saveBtn.textContent = 'Bewaar deze berekening';
    saveBtn.classList.remove('saved');

    lastCalc = {
      type: currentType,
      hoofdsom, percentage, looptijd_dagen: looptijd,
      frequentie: currentType === 'samengesteld' ? parseInt(document.getElementById('frequentie').value, 10) : null,
      rente, eindbedrag,
      timestamp: Date.now()
    };
  });

  // ---------- Save ----------
  document.getElementById('btn-save').addEventListener('click', async () => {
    if (!lastCalc) return;
    const id = 'c' + lastCalc.timestamp + '_' + Math.random().toString(36).slice(2, 7);
    try {
      const res = await window.storage.set(STORAGE_PREFIX + id, JSON.stringify(lastCalc), false);
      if (!res) throw new Error('geen resultaat');
      const saveBtn = document.getElementById('btn-save');
      saveBtn.textContent = 'Bewaard ✓';
      saveBtn.classList.add('saved');
      showToast('Berekening bewaard');
    } catch (e) {
      showToast('Opslaan mislukt, probeer opnieuw');
    }
  });

  // ---------- History ----------
  async function loadHistory() {
    const listEl = document.getElementById('hist-list');
    listEl.innerHTML = '<div class="empty"><span class="empty-emoji">⏳</span><p>Bezig met laden…</p></div>';
    try {
      const listing = await window.storage.list(STORAGE_PREFIX, false);
      const keys = (listing && listing.keys) || [];
      if (keys.length === 0) {
        listEl.innerHTML = '<div class="empty" id="hist-empty"><span class="empty-emoji">🗒️</span><p>Nog geen berekeningen bewaard.<br>Reken iets uit en tik op "Bewaar".</p></div>';
        return;
      }
      const items = [];
      for (const key of keys) {
        try {
          const r = await window.storage.get(key, false);
          if (r && r.value) items.push({ key, data: JSON.parse(r.value) });
        } catch (e) { /* skip broken entry */ }
      }
      items.sort((a, b) => b.data.timestamp - a.data.timestamp);

      if (items.length === 0) {
        listEl.innerHTML = '<div class="empty"><span class="empty-emoji">🗒️</span><p>Nog geen berekeningen bewaard.<br>Reken iets uit en tik op "Bewaar".</p></div>';
        return;
      }

      listEl.innerHTML = '';
      items.forEach(({ key, data }) => listEl.appendChild(renderHistItem(key, data)));
    } catch (e) {
      listEl.innerHTML = '<div class="empty"><span class="empty-emoji">⚠️</span><p>Geschiedenis kon niet geladen worden.</p></div>';
    }
  }

  function renderHistItem(key, d) {
    const el = document.createElement('div');
    el.className = 'hist-item';
    const typeLabel = d.type === 'enkelvoudig' ? 'Enkelvoudig' : 'Samengesteld';
    const dateStr = new Date(d.timestamp).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `
      <div class="hi-main">
        <div class="hi-type">${typeLabel}</div>
        <div class="hi-desc">${fmtEUR(d.hoofdsom)} · ${d.percentage}% · ${d.looptijd_dagen} dagen</div>
        <div class="hi-amount">${fmtEUR(d.rente)} rente</div>
        <div class="hi-date">${dateStr}</div>
      </div>
      <button class="hist-del" aria-label="Verwijder">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
      </button>
    `;
    el.querySelector('.hist-del').addEventListener('click', async () => {
      try {
        await window.storage.delete(key, false);
        el.remove();
        showToast('Verwijderd');
        const remaining = document.querySelectorAll('.hist-item').length;
        if (remaining === 0) loadHistory();
      } catch (e) {
        showToast('Verwijderen mislukt');
      }
    });
    return el;
  }

  document.getElementById('btn-clear-all').addEventListener('click', async () => {
    const items = document.querySelectorAll('.hist-item');
    if (items.length === 0) return;
    if (!confirm('Alle bewaarde berekeningen verwijderen?')) return;
    try {
      const listing = await window.storage.list(STORAGE_PREFIX, false);
      const keys = (listing && listing.keys) || [];
      for (const key of keys) {
        await window.storage.delete(key, false);
      }
      loadHistory();
      showToast('Alles gewist');
    } catch (e) {
      showToast('Wissen mislukt');
    }
  });

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
